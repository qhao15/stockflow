version: 2
updates:
  # Monthly minor and patch updates only. Major versions (e.g. React 19, Express 5) change
  # APIs and are upgraded by hand, on a branch, with testing.
  # Packages that must be upgraded together are grouped, so each PR can pass CI on its own.
  # A package goes into the first group it matches.
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      mui:
        patterns: ['@mui/*', '@emotion/*']
      ag-grid:
        patterns: ['ag-grid-*']
      vite:
        patterns: [vite, '@vitejs/*']
      client-minor:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      server-minor:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # All actions in one PR: they share ci.yml, so separate PRs conflict with each other.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
