version: 2
updates:
  # Packages that must be upgraded together are grouped, so each PR can pass CI on its own
  # (e.g. react-dom 19 fails without react 19). A package goes into the first group it matches.
  # Everything else: minor and patch updates are grouped; each major update gets its own PR.
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      mui:
        patterns: ['@mui/*', '@emotion/*']
      ag-grid:
        patterns: ['ag-grid-*']
      vite:
        patterns: [vite, '@vitejs/*']
      client-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      server-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly

  # All actions in one PR: they share ci.yml, so separate PRs conflict with each other.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
