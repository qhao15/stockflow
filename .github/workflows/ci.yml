name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  server:
    name: Server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PORT: 5000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: sales_inventory_ci
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci

      - name: Syntax check
        run: find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      # Starts the API on an empty database: proves the schema is created from scratch
      # and the server boots, then checks /api/health reports the database as connected.
      - name: Start API and check health
        run: |
          node src/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/api/health | grep -q '"status":"connected"'; then
              echo "API is healthy"; exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy"; cat server.log; exit 1
